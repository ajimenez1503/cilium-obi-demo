apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-nginx
  namespace: obi-nginx-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-nginx
  template:
    metadata:
      labels:
        app: edge-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: edge-nginx
  namespace: obi-nginx-example
spec:
  selector:
    app: edge-nginx
  ports:
    - port: 80
      targetPort: 80
